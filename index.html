<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odbrojavanje do 03.06.2027. u 07:00</title>
  <style>
    :root {
      --grass-1: #062b1f;
      --grass-2: #0b3b2d;
      --grass-3: #1d7d53;
      --field: #1faa68;
      --gold: #f5d76a;
      --gold-strong: #f8c94b;
      --white: #f7f9f8;
      --muted: #dfeee6;
      --panel: rgba(7, 18, 14, 0.72);
      --panel-border: rgba(255,255,255,0.12);
      --shadow: rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.1), transparent 24%),
        linear-gradient(180deg, var(--grass-2) 0%, #071d17 35%, #050d0b 100%);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(255,255,255,0.025),
          rgba(255,255,255,0.025) 2px,
          transparent 2px,
          transparent 14px
        );
      pointer-events: none;
      opacity: 0.8;
    }

    body::after {
      content: "";
      position: absolute;
      inset: 8% 12% 10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,215,106,0.12), transparent 52%);
      filter: blur(32px);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(88vw, 920px);
      text-align: center;
      background: linear-gradient(180deg, rgba(13, 30, 24, 0.82), rgba(7, 16, 12, 0.92));
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      padding: 32px 26px 28px;
      box-shadow: 0 26px 80px var(--shadow);
      backdrop-filter: blur(6px);
    }

    .top-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 9px 18px;
      margin-bottom: 20px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.74rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--gold);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .ball {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #ffffff 0%, #f4f4f4 12%, #d9d9d9 35%, #b9b9b9 100%);
      position: relative;
      box-shadow: inset -4px -4px 0 rgba(0,0,0,0.08), 0 0 12px rgba(255,255,255,0.22);
    }

    .ball::before,
    .ball::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .ball::before {
      background: linear-gradient(90deg, transparent 0 46%, #1d1d1d 46% 54%, transparent 54% 100%);
      transform: rotate(18deg);
    }

    .ball::after {
      background: linear-gradient(180deg, transparent 0 46%, #1d1d1d 46% 54%, transparent 54% 100%);
      transform: rotate(18deg);
    }

    .brand {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.6rem);
      line-height: 1.2;
      letter-spacing: 0.5px;
      font-weight: 900;
      color: var(--white);
      text-shadow: 0 8px 22px rgba(0,0,0,0.26);
    }

    .brand strong {
      color: var(--gold);
    }

    .main-title {
      margin: 18px 0 30px;
      font-size: clamp(2.3rem, 5vw, 4.2rem);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: 0.2px;
      color: var(--white);
      text-shadow: 0 6px 20px rgba(0,0,0,0.22);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 18px;
      margin-top: 12px;
    }

    .box {
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.025));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 18px 12px 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 12px 26px rgba(0,0,0,0.18);
    }

    .number {
      font-size: clamp(2.1rem, 4.5vw, 4.2rem);
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 10px;
      text-shadow: 0 0 18px rgba(245,215,106,0.28);
    }

    .label {
      font-size: 0.8rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .footer-note {
      margin-top: 22px;
      font-size: 1rem;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.82);
      font-weight: 700;
    }

    .footer-note strong {
      color: var(--gold);
    }

    @media (max-width: 620px) {
      .container {
        padding: 26px 18px 22px;
      }

      .countdown {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }

      .brand {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-badge"><span class="ball"></span> Ljetni nogometni kamp</div>
    <p class="brand"><strong>Ekipa Treće Poluvrijeme</strong></p>
    <h1 class="main-title">Do 03.06.2027. u 07:00</h1>

    <div class="countdown">
      <div class="box">
        <div id="days" class="number">0</div>
        <div class="label">Dana</div>
      </div>
      <div class="box">
        <div id="hours" class="number">0</div>
        <div class="label">Sati</div>
      </div>
      <div class="box">
        <div id="minutes" class="number">0</div>
        <div class="label">Minuta</div>
      </div>
      <div class="box">
        <div id="seconds" class="number">0</div>
        <div class="label">Sekundi</div>
      </div>
    </div>

    <div class="footer-note"><strong>e3p</strong> since 2023.</div>
  </div>

  <script>
    const targetDate = new Date('2027-06-03T07:00:00+02:00');

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.querySelector('.container').innerHTML = `
          <div class="top-badge"><span class="ball"></span> Ljetni nogometni kamp</div>
          <p class="brand"><strong>Ekipa Treće Poluvrijeme</strong></p>
          <h1 class="main-title" style="margin-bottom: 0;">Vrijeme je stiglo!</h1>
          <div class="footer-note" style="margin-top: 18px;"><strong>e3p</strong> since 2023.</div>
        `;
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / (60 * 60 * 24));
      const hours = Math.floor((totalSeconds % (60 * 60 * 24)) / (60 * 60));
      const minutes = Math.floor((totalSeconds % (60 * 60)) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById('days').textContent = days;
      document.getElementById('hours').textContent = hours;
      document.getElementById('minutes').textContent = minutes;
      document.getElementById('seconds').textContent = seconds;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>

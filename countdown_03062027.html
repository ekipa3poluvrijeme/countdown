<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odbrojavanje do 03.06.2027. 07:00</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#111827;color:#fff;font-family:Arial,sans-serif}.container{text-align:center}h1{margin-bottom:40px}.countdown{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}.box{background:#1f2937;padding:20px;border-radius:15px;min-width:120px}.number{font-size:3rem;font-weight:bold}.label{margin-top:5px;font-size:1rem;color:#9ca3af}
</style>
</head>
<body>
<div class="container">
<h1>Odbrojavanje do 03.06.2027. u 07:00</h1>
<div class="countdown">
<div class="box"><div id="days" class="number">0</div><div class="label">Dana</div></div>
<div class="box"><div id="hours" class="number">0</div><div class="label">Sati</div></div>
<div class="box"><div id="minutes" class="number">0</div><div class="label">Minuta</div></div>
<div class="box"><div id="seconds" class="number">0</div><div class="label">Sekundi</div></div>
</div></div>
<script>
const targetDate=new Date('2027-06-03T07:00:00+02:00');
function updateCountdown(){const now=new Date();const diff=targetDate-now;if(diff<=0){document.body.innerHTML='<h1 style="color:white;">Vrijeme je stiglo!</h1>';return;}const days=Math.floor(diff/(1000*60*60*24));const hours=Math.floor((diff/(1000*60*60))%24);const minutes=Math.floor((diff/(1000*60))%60);const seconds=Math.floor((diff/1000)%60);document.getElementById('days').textContent=days;document.getElementById('hours').textContent=hours;document.getElementById('minutes').textContent=minutes;document.getElementById('seconds').textContent=seconds;}
updateCountdown();setInterval(updateCountdown,1000);
</script>
</body>
</html>
